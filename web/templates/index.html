<!doctype html>
<html lang="{{.L.Lang}}">
<head>
{{template "head"}}
<title>{{.L.S.siteName}} · {{.L.S.library}}</title>
<meta name="description" content="{{.L.S.tagline}}">
<meta property="og:site_name" content="{{.L.S.siteName}}">
<meta property="og:title" content="{{.L.S.siteName}}">
<meta property="og:description" content="{{.L.S.tagline}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{.PublicURL}}/">
<meta property="og:locale" content="{{.L.OGLocale}}">
</head>
<body data-page="library" data-strings="{{.L.StringsJS}}" data-sw="{{.SW}}">
{{template "icons"}}
<header class="top">
  <a class="logo" href="/"><img src="{{static "spor-logo.png"}}" alt="{{.L.S.siteName}}" width="441" height="200"></a>
  <p class="tagline">{{.L.S.tagline}}</p>
</header>
<section id="feature" class="feature" hidden aria-labelledby="feature-title">
  <div class="ambient" aria-hidden="true"><img id="feature-bg" alt=""></div>
  <div class="feature-in">
    <button type="button" class="feature-cover" id="feature-cover"><img id="feature-img" alt=""></button>
    <div class="feature-text">
      <p class="eyebrow">{{.L.S.latest}}</p>
      <h1 id="feature-title"></h1>
      <p class="meta"><span class="genre-tag" id="feature-genre" hidden></span><span id="feature-meta"></span></p>
      <p class="feature-desc" id="feature-desc" hidden></p>
      <div class="actions">
        <button type="button" class="btn primary" id="feature-play"><svg><use href="#i-play"/></svg><span>{{.L.S.play}}</span></button>
        <button type="button" class="ib round heart" id="feature-like" aria-label="{{.L.S.like}}" aria-pressed="false" hidden><svg class="line"><use href="#i-heart"/></svg></button>
        <span class="counts" id="feature-counts"></span>
      </div>
    </div>
  </div>
</section>
<main>
  <noscript><p class="note">{{.L.S.noJs}}</p></noscript>
  <section id="stage" class="stage" hidden></section>
  <div class="section-head" id="grid-head" hidden><h2>{{.L.S.allTracks}}</h2><span class="totals" id="totals"></span></div>
  <ul id="grid" class="grid" aria-label="{{.L.S.library}}"></ul>
  <p id="empty" class="note" hidden>{{.L.S.empty}}</p>
</main>
{{template "foot" .}}
{{template "playerbar" .L}}
</body>
</html>
